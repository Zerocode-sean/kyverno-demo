apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: minimum-replicas
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
  validations:
    - expression: has(object.spec.replicas) && object.spec.replicas >= 3
      message: "Must have at least 3 replicas on deployments."
