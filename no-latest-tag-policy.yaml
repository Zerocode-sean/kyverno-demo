apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-latest-tag-policy
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  validations:
    - expression: has(object.spec.containers) && object.spec.containers.all(c, !c.image.endsWith(':latest'))
      message: "Must not use the 'latest' tag."

    
