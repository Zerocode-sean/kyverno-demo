apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-team-label
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        has(object.metadata.labels.team) &&
        object.metadata.labels.team != ''
      message: "The label 'team' is required for all deployments."
