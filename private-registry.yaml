apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-Public-Registry-Images

spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  validations:
    - expression: has(object.spec.containers) && object.spec.containers.all(c, c.image.startsWith('kodekloud.io/'))
      message: "Unknown image registry."
